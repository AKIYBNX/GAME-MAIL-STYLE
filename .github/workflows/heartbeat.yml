name: 小橘日记

on:
  schedule:
    - cron: '30 4 * * 1-5'   # 工作日 12:30 北京时间
    - cron: '0 2 * * 0,6'    # 周末 10:00 北京时间
  workflow_dispatch:

jobs:
  diary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send Diary
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python3 scripts/send_diary.py
